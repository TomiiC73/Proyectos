# Standalone: pensado para correrse desde ADENTRO de banco_app/ con
#   docker compose up -d --build
# sin depender del docker-compose.yml de la raiz del repo ni de deploy.sh.
# El Dockerfile ya hace todo el trabajo (build de deps + seed.py idempotente
# + arranque de app.py) - este archivo solo arma el contenedor y le pasa el
# puerto y el .env local.
services:
  hackerbank:
    build:
      context: .
    container_name: hackerbank
    ports:
      - "5000:5000"
    restart: unless-stopped
    # Bind mount: la base SQLite vive en el host (./hackerbank.db), no solo
    # dentro del contenedor. Sin esto cada "docker compose up -d --build"
    # perdia los usuarios creados por signup (recreaba el contenedor desde
    # cero) y el archivo del host quedaba desincronizado del que usaba la app.
    volumes:
      - ./hackerbank.db:/app/hackerbank.db
