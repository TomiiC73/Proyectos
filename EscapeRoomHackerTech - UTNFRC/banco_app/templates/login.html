<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — HackerBank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        colors: { gold: { DEFAULT: '#c9a84c', light: '#e8d38a', dark: '#8f6f27' } },
      },
    },
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  html, body { background: #050507; color: #f5f5f7; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }

  .glow { position: absolute; border-radius: 9999px; filter: blur(110px); pointer-events: none; }

  .grid-fade {
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 65% 65% at 20% 40%, #000 40%, transparent 100%);
    mask-image: radial-gradient(ellipse 65% 65% at 20% 40%, #000 40%, transparent 100%);
  }

  .glass {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .field input {
    width: 100%;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 0.9rem;
    padding: 0.85rem 1rem;
    color: #f5f5f7;
    font-size: 0.95rem;
    outline: none;
    transition: border-color .2s ease, background .2s ease;
  }
  .field input:focus { border-color: #c9a84c; background: rgba(255, 255, 255, 0.06); }
  .field label { display: block; font-size: 0.8rem; color: rgba(245,245,247,0.5); margin-bottom: 0.5rem; }

  .form-error {
    display: none;
    background: rgba(200, 38, 42, 0.1);
    border: 1px solid rgba(200, 38, 42, 0.35);
    color: #ff9a9c;
    font-size: 0.85rem;
    border-radius: 0.75rem;
    padding: 0.7rem 1rem;
    margin-bottom: 1rem;
  }
  .form-error.visible { display: block; }

  .text-gradient-gold {
    background: linear-gradient(95deg, #f3e3b4 0%, #c9a84c 45%, #8f6f27 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
</style>
</head>
<body class="antialiased min-h-screen">

<div class="relative min-h-screen flex items-center justify-center px-6 py-28 lg:py-16 overflow-hidden">
  <div class="absolute inset-0 grid-fade"></div>
  <div class="glow w-[520px] h-[520px] bg-gold/15 -top-40 -left-20"></div>
  <div class="glow w-[420px] h-[420px] bg-gold/10 bottom-0 right-0"></div>

  <div class="relative w-full max-w-md mx-auto">

    <!-- Formulario -->
    <div id="login-card" class="glass rounded-3xl p-8 sm:p-10 w-full mx-auto">
      <div class="text-2xl font-bold mb-2">Ingresar a tu cuenta</div>
      <div class="text-white/45 text-sm mb-7">Ingresá con tu contraseña; luego te pedimos verificación facial.</div>

      <div class="form-error" id="login-error"></div>

      <form id="login-form" class="space-y-4">
        <div class="field">
          <label for="email">Usuario</label>
          <input type="text" id="email" name="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="login-submit"
          class="w-full py-3.5 rounded-full bg-gold text-black font-semibold hover:bg-gold-light transition-colors disabled:opacity-60">
          Continuar
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  gsap.from('#login-card', { opacity: 0, y: 30, duration: 0.9, ease: 'power3.out' });
</script>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
